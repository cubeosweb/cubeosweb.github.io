<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Website Example</title>
    <style>
        /* This makes the iframe responsive and fill the screen */
        .web-container {
            width: 100%;
            height: 80vh; /* 80% of the screen height */
            border: none;  /* Removes the default ugly border */
        }
    </style>
</head>
<body>

   
    
    <iframe 
        src="https://sites.google.com/hallco.org/the-pixel-editon/home" 
        class="web-container"
        title="ThePixelEdition">
    </iframe>

</body>
</html>
